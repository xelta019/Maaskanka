<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maaş Hesaplama | MaaşKanka</title>
  <meta name="description" content="Aylık maaşınızı günlük, haftalık, saatlik ve yıllık kazanca dönüştürün.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 18px 50px;
    }
    .brand { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
    .sub { color: #697386; margin-bottom: 24px; }
    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(20, 30, 50, .08);
      margin-bottom: 18px;
    }
    label { display:block; font-weight:700; margin: 14px 0 8px; }
    input, select {
      width:100%;
      padding:14px;
      border:1px solid #d9deea;
      border-radius:12px;
      font-size:16px;
      outline:none;
    }
    input:focus, select:focus { border-color:#5267ff; }
    button {
      width:100%;
      border:0;
      border-radius:12px;
      padding:15px;
      margin-top:20px;
      background:#5267ff;
      color:white;
      font-size:17px;
      font-weight:800;
      cursor:pointer;
    }
    button:hover { opacity:.92; }
    .results {
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
      margin-top:20px;
    }
    .result {
      background:#f5f7ff;
      border-radius:14px;
      padding:16px;
    }
    .result small { color:#697386; display:block; margin-bottom:6px; }
    .result strong { font-size:20px; }
    .note {
      color:#697386;
      font-size:13px;
      line-height:1.5;
      margin-top:18px;
    }
    @media (max-width: 520px) {
      .results { grid-template-columns:1fr; }
      .card { padding:18px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">💸 MaaşKanka</div>
    <div class="sub">Maaşını saniyeler içinde günlük, haftalık, saatlik ve yıllık kazanca çevir.</div>

    <section class="card">
      <label for="salary">Aylık maaşın (TL)</label>
      <input id="salary" type="number" min="0" step="0.01" placeholder="Örn. 30000">

      <label for="days">Ayda kaç gün çalışıyorsun?</label>
      <input id="days" type="number" min="1" max="31" value="22">

      <label for="hours">Günde kaç saat çalışıyorsun?</label>
      <input id="hours" type="number" min="1" max="24" step="0.5" value="8">

      <button onclick="calculate()">Hesapla 🚀</button>

      <div id="results" class="results" style="display:none;">
        <div class="result"><small>Günlük kazanç</small><strong id="daily">-</strong></div>
        <div class="result"><small>Haftalık kazanç</small><strong id="weekly">-</strong></div>
        <div class="result"><small>Saatlik kazanç</small><strong id="hourly">-</strong></div>
        <div class="result"><small>Yıllık kazanç</small><strong id="yearly">-</strong></div>
      </div>

      <div class="note">
        Bu araç basit bir brüt/net maaş dönüştürme hesabıdır. Vergi, prim, fazla mesai,
        izin ve diğer kesintileri ayrıca hesaba katmaz.
      </div>
    </section>
  </main>

<script>
function tl(value) {
  return new Intl.NumberFormat('tr-TR', {
    style: 'currency',
    currency: 'TRY',
    maximumFractionDigits: 2
  }).format(value);
}

function calculate() {
  const salary = Number(document.getElementById('salary').value);
  const days = Number(document.getElementById('days').value);
  const hours = Number(document.getElementById('hours').value);

  if (!salary || salary < 0 || !days || days < 1 || !hours || hours < 1) {
    alert('Kanka, maaş / çalışma günü / çalışma saati bilgilerini düzgün gir 😄');
    return;
  }

  const daily = salary / days;
  const hourly = daily / hours;
  const weekly = daily * 5;
  const yearly = salary * 12;

  document.getElementById('daily').textContent = tl(daily);
  document.getElementById('weekly').textContent = tl(weekly);
  document.getElementById('hourly').textContent = tl(hourly);
  document.getElementById('yearly').textContent = tl(yearly);
  document.getElementById('results').style.display = 'grid';
}

document.getElementById('salary').addEventListener('keydown', e => {
  if (e.key === 'Enter') calculate();
});
</script>
</body>
</html>
